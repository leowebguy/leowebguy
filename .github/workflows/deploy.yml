name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

#env:
#  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
#  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run build
        env:
          VITE_EMAIL_API_URL: "https://resend-mailer-app-i2w6i.ondigitalocean.app/email/send"
          VITE_EMAIL_API_KEY: "935f2c4b-540a-4a70-a3e7-248e898078f7"
          VITE_EMAIL_TO: "lemmleoncio@gmail.com"
          VITE_RECAPTCHA_KEY: "6LcreHwtAAAAANVIAcZhCTKTALkaNI9Ad7gzaZ8G"
          GITHUB_RUN_ID: ${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - uses: actions/deploy-pages@v5
